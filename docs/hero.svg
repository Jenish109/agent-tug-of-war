<svg xmlns="http://www.w3.org/2000/svg" width="691" height="803" viewBox="0 0 691 803">
<rect width="691" height="803" rx="10" fill="#16161d"/>
<circle cx="20" cy="16" r="5.5" fill="#ff5f57"/><circle cx="38" cy="16" r="5.5" fill="#febc2e"/><circle cx="56" cy="16" r="5.5" fill="#28c840"/>
<g font-family="Menlo, SF Mono, Consolas, monospace" font-size="14">
<text x="18.0" y="77" textLength="504.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  ╭────────────────────────────────────────────────────────╮</text>
<text x="18.0" y="96" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="96" textLength="134.4" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">AGENT TUG OF WAR</text>
<text x="438.0" y="96" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">v0.4.0</text>
<text x="505.2" y="96" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="115" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="505.2" y="115" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="134" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="134" textLength="210.0" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" font-weight="bold" xml:space="preserve">“A hot dog is a sandwich”</text>
<text x="505.2" y="134" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="153" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="505.2" y="153" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="172" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="172" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">✻ CLAUDE</text>
<text x="127.2" y="172" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">argues</text>
<text x="186.0" y="172" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#6ec878" xml:space="preserve">FOR</text>
<text x="236.4" y="172" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">vs</text>
<text x="278.4" y="172" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve">❯ CODEX</text>
<text x="345.6" y="172" textLength="50.4" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">argues</text>
<text x="404.4" y="172" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#e65a50" xml:space="preserve">AGAINST</text>
<text x="505.2" y="172" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="191" textLength="277.2" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ claude sonnet · codex default</text>
<text x="505.2" y="191" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve"> │</text>
<text x="18.0" y="210" textLength="504.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ first to 4 notches · up to 3 rounds · both judge blind │</text>
<text x="18.0" y="229" textLength="504.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  ╰────────────────────────────────────────────────────────╯</text>
<text x="26.4" y="267" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve">CLAUDE wins ▼</text>
<text x="328.8" y="267" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#7896ff" xml:space="preserve">▼ CODEX wins</text>
<text x="34.8" y="286" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">✻ CLAUDE </text>
<text x="110.4" y="286" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━</text>
<text x="127.2" y="286" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">┃</text>
<text x="135.6" y="286" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━━━━━━━━━━</text>
<text x="228.0" y="286" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">◆</text>
<text x="236.4" y="286" textLength="92.4" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━━━━━━━━━━</text>
<text x="328.8" y="286" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve">┃</text>
<text x="337.2" y="286" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━</text>
<text x="354.0" y="286" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve"> CODEX ❯</text>
<text x="228.0" y="305" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">▲</text>
<text x="244.8" y="305" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">dead even</text>
<text x="18.0" y="343" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  ╭─ </text>
<text x="60.0" y="343" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" font-weight="bold" xml:space="preserve">ROUND 1</text>
<text x="127.2" y="343" textLength="546.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">─────────────────────────────────────────────────────────────────</text>
<text x="18.0" y="362" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="362" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">✻ CLAUDE</text>
<text x="127.2" y="362" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">· FOR</text>
<text x="18.0" y="381" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="381" textLength="571.2" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  A hot dog is meat enclosed in bread, which is the sandwich&#x27;s whole</text>
<text x="18.0" y="400" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="400" textLength="596.4" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  definition. USDA&#x27;s own rule says a sandwich is filling between bread.</text>
<text x="18.0" y="419" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="419" textLength="562.8" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  Splitting the bun doesn&#x27;t change it: a sub or a lobster roll is a</text>
<text x="18.0" y="438" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="438" textLength="126.0" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  sandwich too.</text>
<text x="18.0" y="457" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="18.0" y="476" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="476" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve">❯ CODEX</text>
<text x="118.8" y="476" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">· AGAINST</text>
<text x="18.0" y="495" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="495" textLength="596.4" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  USDA labels are regulatory shortcuts, not cuisine. A hot dog’s hinged</text>
<text x="18.0" y="514" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="514" textLength="579.6" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  bun cradles a sausage as its own dish; calling it sandwich flattens</text>
<text x="18.0" y="533" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="533" textLength="302.4" lengthAdjust="spacingAndGlyphs" fill="#d4d4dc" xml:space="preserve">  tacos, wraps, and language itself.</text>
<text x="18.0" y="552" textLength="159.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  ├─ judges (blind)</text>
<text x="186.0" y="552" textLength="487.2" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">──────────────────────────────────────────────────────────</text>
<text x="18.0" y="571" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="571" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve">✻</text>
<text x="68.4" y="571" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">claude judge </text>
<text x="186.0" y="571" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve"> ◀◀</text>
<text x="219.6" y="571" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">CLAUDE +2</text>
<text x="18.0" y="590" textLength="588.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │     FOR gives a clear definition and consistent analogies; AGAINST</text>
<text x="18.0" y="609" textLength="579.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │     dismisses the definition and its taco slippery-slope claim is</text>
<text x="18.0" y="628" textLength="168.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │     unsupported.</text>
<text x="18.0" y="647" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │ </text>
<text x="51.6" y="647" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#7896ff" xml:space="preserve">❯</text>
<text x="68.4" y="647" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">codex judge  </text>
<text x="186.0" y="647" textLength="25.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve"> ◀◀</text>
<text x="219.6" y="647" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">CLAUDE +2</text>
<text x="18.0" y="666" textLength="621.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │     FOR gives definition and rebuttal; AGAINST relies more on culinary</text>
<text x="18.0" y="685" textLength="151.2" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  │     intuition.</text>
<text x="18.0" y="704" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">  ╰─ </text>
<text x="60.0" y="704" textLength="33.6" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">PULL</text>
<text x="102.0" y="704" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">CLAUDE +2</text>
<text x="194.4" y="704" textLength="58.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">HEAVE!!</text>
<text x="261.6" y="704" textLength="411.6" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">─────────────────────────────────────────────────</text>
<text x="26.4" y="742" textLength="109.2" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve">CLAUDE wins ▼</text>
<text x="328.8" y="742" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#7896ff" xml:space="preserve">▼ CODEX wins</text>
<text x="34.8" y="761" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">✻ CLAUDE </text>
<text x="110.4" y="761" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━</text>
<text x="127.2" y="761" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">┃</text>
<text x="135.6" y="761" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━━━━</text>
<text x="177.6" y="761" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">◆</text>
<text x="186.0" y="761" textLength="42.0" lengthAdjust="spacingAndGlyphs" fill="#d97757" font-weight="bold" xml:space="preserve">━━━━━</text>
<text x="228.0" y="761" textLength="100.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">┊━━━━━━━━━━━</text>
<text x="328.8" y="761" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve">┃</text>
<text x="337.2" y="761" textLength="16.8" lengthAdjust="spacingAndGlyphs" fill="#828291" xml:space="preserve">━━</text>
<text x="354.0" y="761" textLength="67.2" lengthAdjust="spacingAndGlyphs" fill="#7896ff" font-weight="bold" xml:space="preserve"> CODEX ❯</text>
<text x="177.6" y="780" textLength="8.4" lengthAdjust="spacingAndGlyphs" fill="#f0be3c" font-weight="bold" xml:space="preserve">▲</text>
<text x="194.4" y="780" textLength="75.6" lengthAdjust="spacingAndGlyphs" fill="#d97757" xml:space="preserve">CLAUDE +2</text>
</g>
